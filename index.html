<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QuickConvert · 万能换算器</title>
<style>
:root{--bg:#F5F5F5;--card:#FFF;--accent:#3949AB;--accent2:#5C6BC0;--fg:#212121;--fg2:#757575;--border:#E0E0E0;--analogy-bg:#E8EAF6;--green:#43A047}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft YaHei UI','PingFang SC',-apple-system,sans-serif;background:var(--bg);color:var(--fg);max-width:740px;margin:0 auto;padding:8px;min-height:100vh;display:flex;flex-direction:column}
.title-bar{flex-shrink:0;background:var(--accent);color:#fff;padding:12px 16px;border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.title-bar h1{font-size:18px;font-weight:700;margin:0}
.title-bar .sub{font-size:12px;opacity:0.85}
.lang-btn{background:#283593;color:#fff;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:13px;white-space:nowrap}
.input-box{flex-shrink:0;background:var(--card);border:1px solid var(--border);border-top:none;padding:10px 16px}
.input-box label{font-size:13px;font-weight:600;color:var(--fg);display:block;margin-bottom:4px}
.input-box input{width:100%;font-size:24px;font-family:'Consolas','Courier New',monospace;border:none;outline:none;text-align:center;padding:10px 0;background:transparent}
.cat-bar{flex-shrink:0;display:flex;flex-wrap:wrap;gap:5px;padding:10px 12px;background:#EEF1FF;border:1px solid var(--accent2);border-top:none;min-height:44px}
.cat-btn{padding:7px 10px;font-size:11px;font-weight:600;border:1px solid var(--border);border-radius:5px;background:#FFF;cursor:pointer;color:var(--fg);white-space:nowrap;transition:all .15s}
.cat-btn:hover{background:#E8EAF6;border-color:var(--accent2)}
.cat-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.base-row{flex-shrink:0;display:flex!important;align-items:center;gap:8px;padding:8px 16px;background:#F8F9FA;border:1px solid var(--border);border-top:none;font-size:12px;min-height:38px}
.base-row label{color:var(--fg2);white-space:nowrap}
.base-row select{padding:4px 10px;border:1px solid var(--border);border-radius:4px;font-size:12px;background:var(--card);max-width:200px}
#currencyBar{display:none;flex-shrink:0;align-items:center;gap:8px;padding:8px 16px;background:#F8F9FA;border:1px solid var(--border);border-top:none;font-size:12px;min-height:38px}
.results{flex:1;min-height:240px;background:var(--card);border:1px solid var(--border);border-top:none;overflow-y:auto;font-family:'Consolas','Courier New',monospace;font-size:12px;line-height:1.8;padding:10px 16px}
.res-line{padding:3px 0;cursor:pointer;border-radius:3px;word-break:break-all}
.res-line:hover{background:#F0F0FF}
.res-line.selected{background:var(--analogy-bg);color:var(--accent)}
.res-line .analogy{color:var(--accent2);font-size:11px;margin-left:14px}
.bottom-bar{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:10px 16px;background:#EEF1FF;border:1px solid var(--accent2);border-top:none;border-radius:0;justify-content:space-between;flex-wrap:wrap}
.bottom-bar .status{font-size:11px;color:var(--fg);font-weight:500}
.btn{padding:7px 16px;border:none;border-radius:5px;cursor:pointer;font-size:12px;color:#fff;white-space:nowrap;font-weight:600}
.btn-copy{background:var(--accent)}
.btn-copy1{background:var(--accent2)}
.btn-copy1:disabled{background:#BDBDBD;color:#616161;cursor:default}
.btn-live{background:var(--green)}
.btn-offline{background:#9E9E9E}
footer{flex-shrink:0;text-align:center;color:var(--fg2);font-size:11px;padding:14px 0 8px}
footer a{color:var(--accent);text-decoration:none}
@media(max-width:480px){
  .cat-btn{padding:5px 7px;font-size:10px}
  .input-box input{font-size:18px}
  .results{font-size:11px;min-height:160px}
  .btn{padding:5px 12px;font-size:11px}
}
</style>
</head>
<body>

<div class="title-bar">
  <div><h1>🔢 QuickConvert</h1><span class="sub" id="subTitle">永远的兰兰 · 万能换算</span></div>
  <a href="https://github.com/podcatcher962/QuickConvert/releases/latest" target="_blank"
     style="background:#283593;color:#fff;text-decoration:none;padding:6px 14px;border-radius:4px;font-size:12px;white-space:nowrap;font-weight:600"
     id="dlBtn">💻 桌面版</a>
  <button class="lang-btn" onclick="toggleLang()" id="langBtn">中/EN</button>
</div>

<div class="input-box">
  <label id="inputLabel">输入数值 (米 (m))</label>
  <input type="text" id="inputVal" placeholder="输入数字..." oninput="convert()" autofocus>
</div>

<div class="cat-bar" id="catBar">
  <button class="cat-btn active" onclick="selectCat('length')">📏 长度</button>
  <button class="cat-btn" onclick="selectCat('weight')">⚖️ 重量</button>
  <button class="cat-btn" onclick="selectCat('temperature')">🌡️ 温度</button>
  <button class="cat-btn" onclick="selectCat('area')">📐 面积</button>
  <button class="cat-btn" onclick="selectCat('volume')">🧪 体积</button>
  <button class="cat-btn" onclick="selectCat('speed')">🏃 速度</button>
  <button class="cat-btn" onclick="selectCat('data')">💾 数据</button>
  <button class="cat-btn" onclick="selectCat('angle')">📐 角度</button>
  <button class="cat-btn" onclick="selectCat('energy')">⚡ 能量</button>
  <button class="cat-btn" onclick="selectCat('pressure')">💨 压力</button>
  <button class="cat-btn" onclick="selectCat('currency')">💰 货币</button>
  <button class="cat-btn" onclick="selectCat('size')">👕 尺码</button>
  <button class="cat-btn" onclick="selectCat('timezone')">🕐 时区</button>
</div>
<div class="base-row" id="baseRow">
  <label id="baseLabel">基准:</label>
  <select id="baseSelect" onchange="onBaseChange()">
    <option value="0" selected>米 (m)</option>
    <option value="1">厘米 (cm)</option>
    <option value="2">毫米 (mm)</option>
    <option value="3">千米 (km)</option>
    <option value="4">尺 (chi)</option>
    <option value="5">寸 (cun)</option>
    <option value="6">丈 (zhang)</option>
    <option value="7">英尺 (ft)</option>
    <option value="8">英寸 (in)</option>
    <option value="9">码 (yd)</option>
    <option value="10">英里 (mi)</option>
    <option value="11">里 (li)</option>
    <option value="12">海里 (nmi)</option>
  </select>
</div>
<div id="currencyBar">
  <label id="curLabel">输入币种:</label>
  <select id="curSelect" onchange="convert()"></select>
  <button class="btn btn-offline" onclick="convert();statusMsg('当前: 离线固定汇率')" id="btnOffline">📴 离线</button>
  <button class="btn btn-live" onclick="fetchLiveRates()" id="btnLive">🌐 实时汇率</button>
</div>
<div class="results" id="results" onclick="handleResultClick(event)" ondblclick="handleResultDblClick(event)"></div>

<div class="bottom-bar">
  <span class="status" id="status">💡 点击结果行查看类比 · 单击复制</span>
  <div style="display:flex;gap:4px">
    <button class="btn btn-copy1" id="btnCopyOne" disabled onclick="copyOne()">📋 复制此项</button>
    <button class="btn btn-copy" onclick="copyAll()">📋 复制全部</button>
  </div>
</div>

<footer>
  <a href="#" onclick="showModal('help');return false" id="linkHelp">📖 使用说明</a> ·
  <a href="#" onclick="showModal('disclaimer');return false" id="linkDisc">⚠ 免责声明</a> ·
  <a href="#" onclick="showModal('about');return false" id="linkAbout">ℹ 关于</a><br>
  <a href="https://github.com/podcatcher962/QuickConvert" target="_blank">github.com/podcatcher962/QuickConvert</a> · © 永远的兰兰 / forever-chitanda · 单文件 · 离线 · 零隐私
</footer>

<div id="modalOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:999;align-items:center;justify-content:center">
  <div style="background:#FFF;border-radius:10px;max-width:560px;width:90%;max-height:80vh;overflow-y:auto;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,0.2);font-size:13px;line-height:1.8">
    <h2 style="margin:0 0 12px;font-size:18px" id="modalTitle"></h2>
    <div id="modalBody" style="white-space:pre-wrap"></div>
    <button onclick="document.getElementById('modalOverlay').style.display='none'" style="margin-top:16px;padding:8px 24px;background:var(--accent);color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:14px">✕ 关闭</button>
  </div>
</div>

// ======================= HELPERS =======================
function t(key,...args){let s=T[L][key]||key;args.forEach((a,i)=>s=s.replace('{}',a));return s}
function ulab(zh,en){return L=='zh'?zh:en}
function curDict(){return CUR_RATES[L]}
function tzDict(){return TZ[L]}
function fmtNum(v){if(Math.abs(v)<1e-15)return'0';if(Math.abs(v)>=1e12||(Math.abs(v)>0&&Math.abs(v)<=1e-10))return v.toExponential(4);if(Math.abs(v)>=1e6)return v.toLocaleString('en-US',{maximumFractionDigits:2});if(Math.abs(v)>=1000)return v.toLocaleString('en-US',{maximumFractionDigits:2});if(Math.abs(v)>=1)return v.toFixed(4);if(Math.abs(v)>=0.001)return v.toFixed(6);return v.toFixed(8)}

function getAnalogy(cat,bv){
  if(!ANALOGIES[cat])return'';
  let best=null,bestDiff=Infinity;
  for(let [thr,zh,en] of ANALOGIES[cat]){
    let diff=Math.abs(bv-thr)/Math.max(Math.abs(thr),1e-9);
    if(diff<=0.6&&diff<bestDiff){best=[zh,en];bestDiff=diff}
  }
  return best?(L=='zh'?best[0]:best[1]):'';
}

// ======================= ACTIONS =======================
function selectCat(key){
  currentCat=key;
  selectedLine=null;
  document.getElementById('btnCopyOne').disabled=true;
  // Own ALL bar display + selector logic here — no dependency on buildUI
  var curBar=document.getElementById('currencyBar'),baseRow=document.getElementById('baseRow');
  if(key==='currency'){
    curBar.style.display='flex';baseRow.style.display='none';
    document.getElementById('curLabel').textContent=t('currencyBase');
    document.getElementById('btnOffline').textContent=t('offline');
    document.getElementById('btnLive').textContent=t('live');
    // Rebuild currency options in current language
    var sel=document.getElementById('curSelect'),cd=curDict();
    sel.innerHTML='';
    for(var ck of Object.keys(cd)){
      var opt=document.createElement('option');
      opt.value=ck;opt.textContent=ck;
      if(ck===currencyBaseKey)opt.selected=true;
      sel.appendChild(opt);
    }
    currencyBaseKey=sel.value;
  }else if(key==='temperature'||UNITS[key]){
    curBar.style.display='none';baseRow.style.display='flex';
    document.getElementById('baseLabel').textContent=t('base');
    if(key==='temperature')buildTempBase();
    else buildBaseSelectFor(key);
  }else{
    curBar.style.display='none';baseRow.style.display='none';
  }
  // Update active button state
  document.querySelectorAll('#catBar .cat-btn').forEach(function(btn){
    var match=btn.getAttribute('onclick')||'';
    btn.classList.toggle('active',match.indexOf(key)>=0);
  });
  updateInputHint();
  convert();
}

function buildBaseSelectFor(cat){
  var sel=document.getElementById('baseSelect'),units=UNITS[cat];
  if(!units||!sel)return;
  sel.innerHTML='';
  var bi=baseIdx[cat]||0;
  if(bi>=units.length)bi=0;
  for(var i=0;i<units.length;i++){
    var opt=document.createElement('option');
    opt.value=i;opt.textContent=ulab(units[i][0],units[i][1]);
    if(i===bi)opt.selected=true;
    sel.appendChild(opt);
  }
}

function onBaseChange(){
  let cat=currentCat==='temperature'?'temperature':currentCat;
  baseIdx[cat]=parseInt(document.getElementById('baseSelect').value);
  updateInputHint();
  convert();
}

function toggleLang(){
  L=L=='zh'?'en':'zh';
  try{localStorage.setItem('qclang',L)}catch(e){}
  document.querySelectorAll('#catBar .cat-btn').forEach(btn=>{
    var catKey=btn.getAttribute('onclick').match(/selectCat\('(\w+)'\)/);
    if(catKey)btn.textContent=catLabels[L][catKey[1]];
  });
  buildUI();
  // Re-run selectCat to rebuild base selector with new language
  selectCat(currentCat);
}

// ======================= CONVERSION =======================
function convert(){
  let results=document.getElementById('results'),raw=document.getElementById('inputVal').value.trim();
  results.innerHTML='';selectedLine=null;document.getElementById('btnCopyOne').disabled=true;
  let lines=[],cat=currentCat,baseVal=0;
  
  try{
    if(cat==='temperature'){lines=convTemp(raw);}
    else if(cat==='currency'){lines=convCurrency(raw);}
    else if(cat==='timezone'){lines=convTimezone();}
    else if(cat==='size'){lines=convSize(raw);}
    else{lines=convGeneral(cat,raw);}
  }catch(e){lines=[{text:'⚠ Error: '+e.message}]}
  
  lines.forEach((l,i)=>{
    let div=document.createElement('div');
    div.className='res-line';
    div.innerHTML=l.text;
    div.setAttribute('data-idx',i);
    results.appendChild(div);
  });
}

function convGeneral(cat,raw){
  let val=parseFloat(raw)||0;
  if(raw&&isNaN(parseFloat(raw)))return [{text:'⚠ '+raw+' — '+(L=='zh'?'请输入有效数字':'invalid number')}];
  let units=UNITS[cat],bi=baseIdx[cat]||0;
  if(bi>=units.length)bi=0;
  let baseFactor=units[bi][2],bv=baseFactor?val/baseFactor:val;
  let analogy=getAnalogy(cat,bv),lines=[],first=true;
  for(let [zh,en,f] of units){
    if(!f)continue;
    let v=bv*f,disp=fmtNum(v),label=ulab(zh,en);
    let txt='  <span style="display:inline-block;min-width:140px;text-align:right">'+disp+'</span>  '+label;
    if(analogy&&first){txt+=' <span class="analogy">💡 '+analogy+'</span>';first=false}
    lines.push({text:txt});
  }
  return lines;
}

function convTemp(raw){
  let val=parseFloat(raw)||0;
  if(raw&&isNaN(parseFloat(raw)))return [{text:'⚠ '+raw+' — '+(L=='zh'?'请输入有效数字':'invalid number')}];
  let bi=baseIdx['temperature']||0,c;
  if(bi===1)c=(val-32)*5/9;else if(bi===2)c=val-273.15;else if(bi===3)c=val*5/4;else if(bi===4)c=(val-491.67)*5/9;else c=val;
  let items=[['摄氏度 (°C)','Celsius (°C)',c],['华氏度 (°F)','Fahrenheit (°F)',c*9/5+32],['开尔文 (K)','Kelvin (K)',c+273.15],['列氏度 (°Re)','Réaumur (°Re)',c*4/5],['兰金度 (°Ra)','Rankine (°Ra)',(c+273.15)*9/5]];
  let analogy=getAnalogy('temperature',c),lines=[],first=true;
  for(let [zh,en,x] of items){
    let label=ulab(zh,en);
    let txt='  <span style="display:inline-block;min-width:140px;text-align:right">'+x.toFixed(4)+'</span>  '+label;
    if(analogy&&first){txt+=' <span class="analogy">💡 '+analogy+'</span>';first=false}
    lines.push({text:txt});
  }
  return lines;
}

function convCurrency(raw){
  let val=parseFloat(raw)||0;
  if(raw&&isNaN(parseFloat(raw)))return [{text:'⚠ '+raw+' — '+(L=='zh'?'请输入有效数字':'invalid number')}];
  let cd=curDict(),baseName=currencyBaseKey||Object.keys(cd)[0];
  let baseRate=cd[baseName]||1,usd=baseRate?val/baseRate:val,lines=[];
  for(let [name,rate] of Object.entries(cd)){
    lines.push({text:'  <span style="display:inline-block;min-width:140px;text-align:right">'+(usd*rate).toFixed(4)+'</span>  '+name});
  }
  lines.push({text:'<br>💡 '+(L=='zh'?'以 '+baseName+' 为基准换算':'Base: '+baseName)+(liveRates?' (实时)':' (离线)')});
  return lines;
}

function convTimezone(){
  let now=new Date(),tz=tzDict(),lines=[];
  for(let [name,off] of Object.entries(tz)){
    let local=new Date(now.getTime()+off*3600000);
    let sign=off>=0?'+':'';
    lines.push({text:'  UTC'+sign+off.toFixed(1)+'  '+local.toTimeString().slice(0,5)+'  '+name});
  }
  lines.push({text:'<br>  '+t('utcTime')+'  '+now.toISOString().slice(0,16).replace('T',' ')});
  return lines;
}

function convSize(raw){
  let cn=parseInt(raw)||40,lines=[{text:t('sizeHeader')+'<br>'}];
  let gLabels={'men':t('men'),'women':t('women')};
  for(let [g,data] of Object.entries(SHOE)){
    lines.push({text:'  '+gLabels[g]+':'});
    if(!data.CN.includes(cn)){lines.push({text:'    CN '+cn+' → '+t('outOfRange')+'<br>'});continue}
    let idx=data.CN.indexOf(cn);
    for(let sys of['CN','US','UK','EU']){
      if(idx<data[sys].length)lines.push({text:'    '+sys+': '+data[sys][idx]});
    }
    lines.push({text:''});
  }
  lines.push({text:t('clothHeader')});
  let cloth={160:'XS',165:'S',170:'M',175:'L',180:'XL',185:'XXL'};
  for(let[h,s]of Object.entries(cloth))lines.push({text:'    '+h+'cm → CN: '+s+'-'+h+' | US: '+s});
  return lines;
}

// ======================= RESULT INTERACTION =======================
function handleResultClick(e){
  let div=e.target.closest('.res-line');
  if(!div)return;
  document.querySelectorAll('.res-line').forEach(d=>d.classList.remove('selected'));
  div.classList.add('selected');
  selectedLine=parseInt(div.getAttribute('data-idx'));
  document.getElementById('btnCopyOne').disabled=false;
}

function handleResultDblClick(e){
  let div=e.target.closest('.res-line');
  if(!div)return;
  let txt=div.textContent.trim();
  if(txt)navigator.clipboard.writeText(txt).then(()=>statusMsg(t('copied')));
}

function copyOne(){
  if(selectedLine===null)return;
  let divs=document.querySelectorAll('.res-line');
  if(selectedLine<divs.length){
    let txt=divs[selectedLine].textContent.trim();
    if(txt)navigator.clipboard.writeText(txt).then(()=>statusMsg(t('copied')));
  }
}

function copyAll(){
  let divs=document.querySelectorAll('.res-line');
  let txt=Array.from(divs).map(d=>d.textContent.trim()).join('\n');
  if(txt)navigator.clipboard.writeText(txt).then(()=>statusMsg(t('copied')));
}

function statusMsg(msg){
  let s=document.getElementById('status');
  s.textContent='✅ '+msg;
  setTimeout(()=>s.textContent=t('status'),2000);
}

async function fetchLiveRates(){
  statusMsg(t('fetching'));
  try{
    let r=await fetch('https://open.er-api.com/v6/latest/USD');
    let data=await r.json();
    for(let lang of['zh','en']){
      for(let name of Object.keys(CUR_RATES[lang])){
        let code=name.split('(').pop().replace(')','');
        if(data.rates[code])CUR_RATES[lang][name]=data.rates[code];
      }
    }
    liveRates=true;
    statusMsg(t('fetchOk'));
    convert();
  }catch(e){
    statusMsg(t('fetchFail'));
  }
}
